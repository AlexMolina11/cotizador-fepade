<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Cotizador FEPADE - Iniciar Sesión</title>
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-red: #B0291C;
            --primary-gold: #CC8E00;
            --primary-green: #0ce98b8c;
            --background-bk-green: radial-gradient(circle at 100% 70.9666633605957%, rgba(12, 233, 139, 0.55) 0%, 10.5%, rgba(12, 233, 139, 0) 35%), radial-gradient(circle at 52.266674041748054% 38.43336423238119%, rgba(0, 0, 0, 0.99) 0%, 25%, rgba(0, 0, 0, 0) 50%), radial-gradient(circle at 0% 66.70000076293945%, rgba(12, 233, 139, 0.55) 0%, 11.4%, rgba(12, 233, 139, 0) 38%), radial-gradient(circle at 48.9013671875% 49.521484375%, #000000 0%, 100%, rgba(0, 0, 0, 0) 100%);
            --white: #ffffff;
            --black: #000000;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(0, 0, 0, 0.2);
            --input-border: rgba(255, 255, 255, 0.2);
            --shadow-glow: 0 0 40px rgba(12, 233, 139, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-bk-green);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Enhanced animated background elements */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-orb {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, rgba(12, 233, 139, 0.4), rgba(204, 142, 0, 0.3));
            filter: blur(1px);
            animation: float 8s ease-in-out infinite;
        }

        .orb-1 {
            width: 120px;
            height: 120px;
            top: 10%;
            right: 15%;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 80px;
            height: 80px;
            bottom: 20%;
            left: 10%;
            animation-delay: 2s;
        }

        .orb-3 {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0px) translateX(0px) scale(1);
                opacity: 0.6;
            }
            33% { 
                transform: translateY(-20px) translateX(10px) scale(1.1);
                opacity: 0.8;
            }
            66% { 
                transform: translateY(10px) translateX(-15px) scale(0.9);
                opacity: 0.7;
            }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            animation: slideUp 1s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 2px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 
                var(--shadow-glow),
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            position: relative;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--primary-green), var(--primary-gold), transparent);
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .login-header {
            padding: 3rem 2rem 2rem;
            text-align: center;
            position: relative;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
        }

        .logo {
            width: 70%;
            max-width: 220px;
            height: auto;
            margin-bottom: 1.5rem;
            filter: 
                drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3))
                drop-shadow(0 0 20px rgba(12, 233, 139, 0.3));
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
            filter: 
                drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4))
                drop-shadow(0 0 30px rgba(12, 233, 139, 0.5));
        }

        .login-title {
            color: var(--text-primary);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.025em;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .login-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.75rem;
            position: relative;
        }

        .form-label {
            display: block;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: color 0.3s ease;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3.25rem;
            background: var(--input-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--input-border);
            border-radius: 16px;
            font-size: 1rem;
            color: var(--text-primary);
            transition: all 0.3s ease;
            outline: none;
            font-weight: 500;
        }

        .form-input:focus {
            border-color: var(--primary-green);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 
                0 0 0 4px rgba(12, 233, 139, 0.15),
                0 0 20px rgba(12, 233, 139, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .form-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .form-input:focus + .input-icon {
            color: var(--primary-green);
            transform: translateY(-50%) scale(1.1);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            padding: 0.5rem;
            border-radius: 8px;
        }

        .password-toggle:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
        }

        .login-button {
            width: 100%;
            padding: 1rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-red) 0%, #8B1E14 50%, var(--primary-red) 100%);
            background-size: 200% 200%;
            color: var(--white);
            border: none;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            box-shadow: 
                0 8px 16px rgba(176, 41, 28, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .login-button:hover {
            background-position: 100% 0;
            transform: translateY(-3px);
            box-shadow: 
                0 12px 24px rgba(176, 41, 28, 0.4),
                0 0 30px rgba(204, 142, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:active {
            transform: translateY(-1px);
        }

        .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid var(--white);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.75rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: linear-gradient(135deg, rgba(176, 41, 28, 0.2) 0%, rgba(176, 41, 28, 0.1) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(176, 41, 28, 0.4);
            color: #ff6b6b;
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
            animation: shake 0.6s ease-in-out;
            box-shadow: 0 4px 12px rgba(176, 41, 28, 0.2);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .success-message {
            background: linear-gradient(135deg, rgba(12, 233, 139, 0.2) 0%, rgba(12, 233, 139, 0.1) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(12, 233, 139, 0.4);
            color: var(--primary-green);
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
            display: none;
            box-shadow: 0 4px 12px rgba(12, 233, 139, 0.2);
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            .login-container {
                max-width: 100%;
            }

            .login-header {
                padding: 2rem 1.5rem 1.5rem;
            }

            .login-body {
                padding: 1.5rem;
            }

            .login-title {
                font-size: 1.5rem;
            }

            .form-input {
                padding: 0.875rem 0.875rem 0.875rem 3rem;
            }

            .input-icon {
                left: 0.875rem;
                font-size: 1.1rem;
            }
        }

        @media (max-width: 320px) {
            .login-header {
                padding: 1.5rem 1rem 1rem;
            }

            .login-body {
                padding: 1rem;
            }

            .form-group {
                margin-bottom: 1.5rem;
            }
        }

        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Custom focus styles for better accessibility */
        .form-input:focus,
        .login-button:focus,
        .password-toggle:focus {
            outline: 2px solid var(--primary-green);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="bg-decoration">
        <div class="floating-orb orb-1"></div>
        <div class="floating-orb orb-2"></div>
        <div class="floating-orb orb-3"></div>
    </div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="../public/images/logosfepade/Logo_FEPADE_vertical.png" alt="Educar & Convivir" class="logo" />
                <h1 class="login-title">Bienvenidos</h1>
                <p class="login-subtitle">Ingrese sus credenciales para continuar</p>
            </div>
            
            <div class="login-body">
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Usuario o contraseña incorrectos</span>
                </div>
                
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <span>Iniciando sesión...</span>
                </div>
                
                <form method="post" id="frmAcceso">
                    <div class="form-group">
                        <label for="logina" class="form-label">Usuario</label>
                        <div class="input-wrapper">
                            <input 
                                id="logina" 
                                name="logina" 
                                type="text" 
                                class="form-input" 
                                placeholder="Ingrese su usuario"
                                onchange="validarEntrada(this)"
                                required
                                autocomplete="username"
                            >
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="clavea" class="form-label">Contraseña</label>
                        <div class="input-wrapper">
                            <input 
                                id="clavea" 
                                name="clavea" 
                                type="password" 
                                class="form-input" 
                                placeholder="Ingrese su contraseña"
                                required
                                autocomplete="current-password"
                            >
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Mostrar contraseña">
                                <i class="fas fa-eye" id="passwordToggleIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="login-button" id="loginButton">
                        <div class="loading-spinner" id="loadingSpinner"></div>
                        <span id="buttonText">Iniciar Sesión</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Tu script de login original -->
    <script type="text/javascript" src="scripts/login.js"></script>
    
    <script>
        // Función original de validación
        function validarEntrada(inputElement) {
            var regex = /['"\\*|/]/g;
            var valor = inputElement.value;
            valor = valor.replace(regex, '');
            inputElement.value = valor;
        }

        // Función para mostrar/ocultar contraseña
        function togglePassword() {
            const passwordInput = document.getElementById('clavea');
            const toggleIcon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        // Mejorar la experiencia del formulario
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('frmAcceso');
            const loginButton = document.getElementById('loginButton');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const buttonText = document.getElementById('buttonText');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Agregar efectos de focus a los inputs
            const inputs = document.querySelectorAll('.form-input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.parentElement.querySelector('.form-label').style.color = 'var(--primary-green)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.parentElement.querySelector('.form-label').style.color = 'var(--text-primary)';
                });

                // Animación al escribir
                input.addEventListener('input', function() {
                    if (this.value) {
                        this.style.transform = 'translateY(-2px)';
                        this.style.borderColor = 'rgba(12, 233, 139, 0.5)';
                    } else {
                        this.style.transform = 'translateY(0)';
                        this.style.borderColor = 'var(--input-border)';
                    }
                });
            });

            // Mejorar el manejo del envío del formulario
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Ocultar mensajes previos
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
                
                // Mostrar estado de carga
                loginButton.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                buttonText.textContent = 'Verificando...';
                
                // Simular validación (aquí iría tu lógica de login)
                setTimeout(() => {
                    const username = document.getElementById('logina').value;
                    const password = document.getElementById('clavea').value;
                    
                    // Ejemplo de validación (reemplazar con tu lógica)
                    if (username && password) {
                        successMessage.style.display = 'block';
                        buttonText.textContent = 'Accediendo...';
                        // Aquí llamarías a tu script de login original
                    } else {
                        errorMessage.style.display = 'block';
                        errorMessage.querySelector('#errorText').textContent = 'Por favor, complete todos los campos';
                    }
                    
                    // Restaurar botón después de un tiempo
                    setTimeout(() => {
                        loginButton.disabled = false;
                        loadingSpinner.style.display = 'none';
                        buttonText.textContent = 'Iniciar Sesión';
                    }, 1000);
                    
                }, 1200);
            });

            // Agregar validación en tiempo real
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    if (this.required && !this.value) {
                        this.style.borderColor = 'var(--primary-red)';
                        this.style.boxShadow = '0 0 0 4px rgba(176, 41, 28, 0.15)';
                    }
                });

                input.addEventListener('input', function() {
                    if (this.required && this.value) {
                        this.style.borderColor = 'rgba(12, 233, 139, 0.4)';
                        this.style.boxShadow = 'none';
                    }
                });
            });

            // Efectos de parallax sutil en el mouse
            document.addEventListener('mousemove', function(e) {
                const orbs = document.querySelectorAll('.floating-orb');
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                
                orbs.forEach((orb, index) => {
                    const speed = (index + 1) * 0.5;
                    const x = (mouseX - 0.5) * speed;
                    const y = (mouseY - 0.5) * speed;
                    orb.style.transform = `translate(${x}px, ${y}px)`;
                });
            });
        });

        // Agregar soporte para Enter en los campos
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const activeElement = document.activeElement;
                if (activeElement.classList.contains('form-input')) {
                    const form = document.getElementById('frmAcceso');
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
