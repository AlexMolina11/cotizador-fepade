<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Proyectos FEPADE - Iniciar Sesión</title>
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-red: #B0291C;
            --primary-gold: #CC8E00;
            --primary-green: #0ce98b8c;
            --background-bk-green: radial-gradient(circle at 100% 70.9666633605957%, rgba(12, 233, 139, 0.55) 0%, 10.5%, rgba(12, 233, 139, 0) 35%), radial-gradient(circle at 52.266674041748054% 38.43336423238119%, rgba(0, 0, 0, 0.99) 0%, 25%, rgba(0, 0, 0, 0) 50%), radial-gradient(circle at 0% 66.70000076293945%, rgba(12, 233, 139, 0.55) 0%, 11.4%, rgba(12, 233, 139, 0) 38%), radial-gradient(circle at 48.9013671875% 49.521484375%, #000000 0%, 100%, rgba(0, 0, 0, 0) 100%);
            --white: #ffffff;
            --black: #000000;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--background-bk-green);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow-x: hidden;
        }

        /* Animated background elements */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .bg-decoration::before,
        .bg-decoration::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(204, 142, 0, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .bg-decoration::before {
            width: 300px;
            height: 300px;
            top: -150px;
            right: -150px;
            animation-delay: 0s;
        }

        .bg-decoration::after {
            width: 200px;
            height: 200px;
            bottom: -100px;
            left: -100px;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: var(--white);
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            overflow: hidden;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .login-header {
            background: linear-gradient(135deg, var(--white) 0%, var(--gray-50) 100%);
            padding: 2.5rem 2rem 1.5rem;
            text-align: center;
            position: relative;
        }

        .login-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-red), var(--primary-gold));
            border-radius: 2px;
        }

        .logo {
            width: 60%;
            max-width: 200px;
            height: auto;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.1));
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .login-title {
            color: var(--gray-800);
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--gray-500);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .login-body {
            padding: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-label {
            display: block;
            color: var(--gray-700);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            transition: color 0.2s ease;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            border: 2px solid var(--gray-200);
            border-radius: 12px;
            font-size: 1rem;
            color: var(--gray-800);
            background: var(--white);
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 0 3px rgba(176, 41, 28, 0.1);
            transform: translateY(-1px);
        }

        .form-input::placeholder {
            color: var(--gray-400);
            font-weight: 400;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .form-input:focus + .input-icon {
            color: var(--primary-red);
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: var(--gray-600);
        }

        .login-button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            background: linear-gradient(135deg, var(--primary-red) 0%, #8B1E14 100%);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .login-button:hover {
            background: linear-gradient(135deg, #8B1E14 0%, var(--primary-red) 100%);
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid var(--white);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 0.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success-message {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            display: none;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            body {
                padding: 0.5rem;
            }

            .login-container {
                max-width: 100%;
            }

            .login-header {
                padding: 2rem 1.5rem 1.5rem;
            }

            .login-body {
                padding: 1.5rem;
            }

            .login-title {
                font-size: 1.25rem;
            }

            .form-input {
                padding: 0.75rem 0.875rem 0.75rem 2.75rem;
            }

            .input-icon {
                left: 0.875rem;
                font-size: 1rem;
            }
        }

        @media (max-width: 320px) {
            .login-header {
                padding: 1.5rem 1rem 1rem;
            }

            .login-body {
                padding: 1rem;
            }

            .form-group {
                margin-bottom: 1.25rem;
            }
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            .login-card {
                background: rgba(255, 255, 255, 0.95);
            }
        }

        /* High contrast mode */
        @media (prefers-contrast: high) {
            .form-input {
                border-width: 3px;
            }
            
            .login-button {
                border: 2px solid var(--white);
            }
        }

        /* Reduce motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="../public/images/logosfepade/Logo_FEPADE_vertical.png" alt="Educar & Convivir" class="logo" />
                <h1 class="login-title">Bienvenidos</h1>
                <p class="login-subtitle">Ingrese sus credenciales para continuar</p>
            </div>
            
            <div class="login-body">
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Usuario o contraseña incorrectos</span>
                </div>
                
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i>
                    <span>Iniciando sesión...</span>
                </div>
                
                <form method="post" id="frmAcceso">
                    <div class="form-group">
                        <label for="logina" class="form-label">Usuario</label>
                        <div class="input-wrapper">
                            <input 
                                id="logina" 
                                name="logina" 
                                type="text" 
                                class="form-input" 
                                placeholder="Ingrese su usuario"
                                onchange="validarEntrada(this)"
                                required
                                autocomplete="username"
                            >
                            <i class="fas fa-user input-icon"></i>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="clavea" class="form-label">Contraseña</label>
                        <div class="input-wrapper">
                            <input 
                                id="clavea" 
                                name="clavea" 
                                type="password" 
                                class="form-input" 
                                placeholder="Ingrese su contraseña"
                                required
                                autocomplete="current-password"
                            >
                            <i class="fas fa-lock input-icon"></i>
                            <button type="button" class="password-toggle" onclick="togglePassword()">
                                <i class="fas fa-eye" id="passwordToggleIcon"></i>
                            </button>
                        </div>
                    </div>
                    
                    <button type="submit" class="login-button" id="loginButton">
                        <div class="loading-spinner" id="loadingSpinner"></div>
                        <span id="buttonText">Iniciar Sesión</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../public/bower_components/jquery/dist/jquery.min.js"></script>
    <script src="../public/bower_components/bootstrap/dist/js/bootstrap.min.js"></script>
    <script src="../public/js/bootbox.min.js"></script>
    
    <script>
        // Función original de validación
        function validarEntrada(inputElement) {
            var regex = /['"\\*|/]/g;
            var valor = inputElement.value;
            valor = valor.replace(regex, '');
            inputElement.value = valor;
        }

        // Función para mostrar/ocultar contraseña
        function togglePassword() {
            const passwordInput = document.getElementById('clavea');
            const toggleIcon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        }

        // Mejorar la experiencia del formulario
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('frmAcceso');
            const loginButton = document.getElementById('loginButton');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const buttonText = document.getElementById('buttonText');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');

            // Agregar efectos de focus a los inputs
            const inputs = document.querySelectorAll('.form-input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.parentElement.querySelector('.form-label').style.color = 'var(--primary-red)';
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.parentElement.querySelector('.form-label').style.color = 'var(--gray-700)';
                });

                // Animación al escribir
                input.addEventListener('input', function() {
                    if (this.value) {
                        this.style.transform = 'translateY(-1px)';
                    } else {
                        this.style.transform = 'translateY(0)';
                    }
                });
            });

            // Mejorar el manejo del envío del formulario
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Ocultar mensajes previos
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
                
                // Mostrar estado de carga
                loginButton.disabled = true;
                loadingSpinner.style.display = 'inline-block';
                buttonText.textContent = 'Iniciando sesión...';
                
                // Simular validación (aquí iría tu lógica de login)
                setTimeout(() => {
                    const username = document.getElementById('logina').value;
                    const password = document.getElementById('clavea').value;
                    
                    // Ejemplo de validación (reemplazar con tu lógica)
                    if (username && password) {
                        successMessage.style.display = 'block';
                        // Aquí llamarías a tu script de login original
                        // Por ejemplo: ejecutar el contenido de login.js
                    } else {
                        errorMessage.style.display = 'block';
                        errorMessage.querySelector('#errorText').textContent = 'Por favor, complete todos los campos';
                    }
                    
                    // Restaurar botón
                    loginButton.disabled = false;
                    loadingSpinner.style.display = 'none';
                    buttonText.textContent = 'Iniciar Sesión';
                }, 1500);
            });

            // Agregar validación en tiempo real
            inputs.forEach(input => {
                input.addEventListener('blur', function() {
                    if (this.required && !this.value) {
                        this.style.borderColor = 'var(--primary-red)';
                        this.style.boxShadow = '0 0 0 3px rgba(176, 41, 28, 0.1)';
                    } else {
                        this.style.borderColor = 'var(--gray-200)';
                        this.style.boxShadow = 'none';
                    }
                });
            });
        });

        // Agregar soporte para Enter en los campos
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('frmAcceso');
                form.dispatchEvent(new Event('submit'));
            }
        });
    </script>
    
    <!-- Tu script de login original -->
    <script type="text/javascript" src="scripts/login.js"></script>
</body>
</html>
